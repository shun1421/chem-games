<link rel="stylesheet" href="common.css">

<body>
<header class="home-head">
  <div class="en">CHEM GAME LAB</div>
  <h1>化学ゲームラボ</h1>
  <div class="mascot"><img src="img/gorilla.png" alt="" width="84" height="84"><div class="bubble" id="say">ようこそ。気になるゲームから、やってみよう。</div></div>
  <div class="prog hidden" id="prog"></div>
</header>
<main id="list" class="home"></main>
<footer class="home-foot">遊んで身につく高校化学 — 全24アプリ / スマホ対応<br>
ブラウザだけで動きます。授業・すきま時間・テスト前にどうぞ。<br>
<span class="credit">制作: 鹿児島中央高校 福永</span><br>
<button class="clr hidden" id="clr" onclick="clearRecords()">この端末の記録を消す</button></footer>
<script src="common.js"></script>
<script>
const UNITS=[
 {t:'元素と周期表',c:'var(--teal)',games:[
  {no:1,f:'element-match.html',sym:'118',nm:'元素マッチング',ds:'元素名⇄元素記号のペアをタップで消していく40秒勝負。基本20〜全118元素の3レベル。',k:'タイムアタック'},
  {no:2,f:'element-position.html',bu:'問',sym:'⊞',nm:'ポジションマスター',ds:'周期表の光ったマスに入る元素を4択で当てる。族と周期の感覚を体で覚える。',k:'クイズ'},
 ]},
 {t:'物質の構成・化学結合',c:'var(--teal)',games:[
  {no:4,f:'lewis-builder.html',sym:'e·',nm:'分子ビルダー',ds:'電子式を組み立てて原子をゲット。漂う原子をドラッグして分子を合成!',k:'アクション'},
  {no:6,f:'crystal-classify.html',sym:'Xt',nm:'結晶ソムリエ',ds:'化学式から結晶を4分類。「???」問題は質問で推理する20の扉モード。',k:'クイズ+推理'},
  {no:8,f:'polarity-3d.html',sym:'δ+',nm:'極性ジャッジ3D',ds:'3D分子をぐるぐる回して、結合に双極子の矢印を割り当て→極性/無極性を判定。',k:'3D判定'},
  {no:10,f:'ion-formula.html',sym:'Na⁺',nm:'イオン式マスター',ds:'イオンの価数を4択で判定し、+と−がつり合うように組成式を組み立てる。全15問。',k:'クイズ+組立'},
  {no:11,f:'formula-tower.html',sym:'Xn',nm:'化学式タワー',ds:'モンスターが言う物質名を、周期表から元素記号を順に押して化学式に。化学基礎の71物質から10体を討伐。',k:'アクションクイズ'},
  {no:14,f:'lattice-viewer.html',sym:'a³',nm:'結晶格子ラボ',ds:'単純立方・体心・面心・六方最密・NaCl型の3D結晶モデル。配位数と原子半径を体感。',k:'教材'},
 ]},
 {t:'物質量と化学反応式',c:'var(--teal)',games:[
  {no:15,f:'sig-figs.html',sym:'×10ⁿ',nm:'有効数字ドリル',ds:'エクセル風の桁ボタンで四捨五入・桁数かぞえ・計算後の丸めを機械的にマスター。',k:'ドリル'},
  {no:16,f:'mol-sprint.html',sym:'mol',nm:'モル換算スプリント',ds:'単位が約分される分数を選んで質量⇄mol⇄個数⇄体積を変換。molをはさむ2段階問題も。',k:'計算タイムアタック'},
  {no:18,f:'stoichiometry.html',sym:'aA',nm:'量的関係マスター',ds:'係数合わせ→nを使った物質量比→mol→質量・体積。5ステップで計算の道すじをたどる。',k:'ステップ演習'},
  {no:19,f:'excess-reagent.html',sym:'Δn',nm:'過不足ある反応',ds:'反応前・変化・反応後の表をテンキーで埋め、未反応で残る物質を当てる。全5問。',k:'表うめクイズ'},
 ]},
 {t:'酸と塩基',c:'var(--rose)',games:[
  {no:32,f:'salt-judge.html',sym:'pH',nm:'塩の液性ジャッジ',ds:'塩の水溶液は酸性?中性?塩基性?もとの酸・塩基の強弱で見きわめる。',k:'クイズ'},
 ]},
 {t:'酸化還元・電池と電気分解',c:'var(--rose)',games:[
  {no:36,f:'oxidation-number.html',sym:'+7',nm:'酸化数バトル',ds:'指定原子の酸化数を高速判定。H₂O₂やNaHの例外ルールも登場。',k:'計算タイムアタック'},
  {no:40,f:'electrolysis.html',sym:'e⁻',nm:'電気分解ナビ',ds:'✕をつける→陽極→陰極→反応式。4ステップの手順で電気分解を完全攻略。',k:'手順シミュレーション'},
 ]},
 {t:'状態変化と気体',c:'var(--blue)',games:[
  {no:50,f:'gas-sim.html',sym:'PVT',nm:'気体分子ラボ',ds:'P・V・T・nを操作して分子運動を観察。変数を連続変化させるとグラフも描画。理想気体と実在気体(H₂O)を比較。',k:'教材'},
  {no:51,f:'gas-race.html',sym:'PV',nm:'気体方程式レース',ds:'PV=nRTの計算レース。R=8.3×10³をあやつって最速で解け。',k:'計算タイムアタック'},
 ]},
 {t:'溶液',c:'var(--green)',games:[
  {no:58,f:'colloid-match.html',sym:'Sol',nm:'コロイドマッチ',ds:'チンダル・凝析・塩析…混同しがちなコロイド用語を高速マッチング。',k:'クイズ'},
 ]},
 {t:'化学反応と平衡',c:'var(--purple)',games:[
  {no:64,f:'equilibrium-travel.html',sym:'K',nm:'太平洋トラベラー',ds:'ルーレットで番号を呼び、日本⇌アメリカを行き来する人数で平衡を体感。実戦・シミュレーション・H₂+I₂⇌2HI の3モード。',k:'授業用シミュレータ'},
  {no:66,f:'le-chatelier.html',sym:'⇌',nm:'平衡移動よそう',ds:'ルシャトリエの原理で平衡の移動方向を予想。不活性気体のひっかけも。',k:'クイズ'},
 ]},
 {t:'無機化学',c:'var(--brown)',games:[
  {no:73,f:'precipitate-colors.html',sym:'↓',nm:'沈殿カラー図鑑',ds:'AgCl?CdS?クロム酸塩?沈殿の色を全問コンプリートせよ。',k:'クイズ'},
 ]},
 {t:'有機化学',c:'var(--brown)',games:[
  {no:89,f:'detection-match.html',sym:'Ag',nm:'検出反応マッチ',ds:'銀鏡・ヨードホルム・FeCl₃…検出反応と構造をつなげて構造決定に強くなる。',k:'クイズ'},
 ]},
 {t:'高分子化合物',c:'var(--green)',games:[
  {no:91,f:'polymer-quiz.html',sym:'[-]n',nm:'重合しきわけ',ds:'付加?縮合?開環?付加縮合?高分子の名前から重合様式を見きわめる。',k:'クイズ'},
  {no:93,f:'sugar-rhythm.html',sym:'C₆',nm:'単糖リズム',ds:'ドン・カッ・ドーン!六員環を1位から時計回りにたたいて、単糖の構造式をリズムで覚える。',k:'リズム'},
 ]},
];
const main=document.getElementById('list');
for(const u of UNITS){
  const h=document.createElement('div');h.className='unit';
  h.innerHTML='<span class="sq" style="background:'+u.c+'"></span><h2>'+u.t+'</h2><span class="ln"></span>';
  main.appendChild(h);
  const g=document.createElement('div');g.className='grid';
  for(const gm of u.games){
    const a=document.createElement('a');
    a.className='tile';a.href=gm.f;a.style.setProperty('--c',u.c);
    const sl=[...gm.sym].length,sc=sl>=4?' s4':(sl===3?' s3':'');   // 記号が長いときは字を小さく
    a.innerHTML='<span class="no">No.'+gm.no+'</span><div class="sym'+sc+'">'+gm.sym+'</div>'+
     '<div class="tx"><div class="nm">'+gm.nm+'</div><div class="ds">'+gm.ds+'</div>'+
     '<span class="kind">'+gm.k+'</span><span class="rec"></span></div>';
    a.dataset.g=gm.f.replace('.html','');a.dataset.u=gm.bu||'点';
    g.appendChild(a);
  }
  main.appendChild(g);
}

// ==== 各ゲームが localStorage に残した記録をタイルに出す(読めない環境では何も出さない) ====
const PRE='chemgames:';
function readRec(name){
  let best=null,seen=false;
  try{
    const p=PRE+name+':';
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||k.indexOf(p)!==0)continue;
      const r=k.slice(p.length);
      if(r==='seen')seen=true;
      else if(r==='best'||r.indexOf('best:')===0){   // レベル別・モード別はいちばん高いもの
        const v=parseInt(localStorage.getItem(k),10);
        if(isFinite(v)&&(best===null||v>best))best=v;
      }
    }
  }catch(e){}
  return {best:best,seen:seen};
}
function paintRecords(){
  let done=0,all=0;
  document.querySelectorAll('a.tile').forEach(a=>{
    all++;
    const r=readRec(a.dataset.g),el=a.querySelector('.rec');
    if(r.best!==null){el.className='rec';el.textContent='★ ベスト '+CG.fmt(r.best)+a.dataset.u;done++;}
    else if(r.seen){el.className='rec seen';el.textContent='✓ 使った';done++;}
    else{el.className='rec';el.textContent='';}
  });
  const pg=document.getElementById('prog');
  pg.innerHTML=done?'<b>'+done+'</b> / '+all+' 本にチャレンジ済み':'';
  pg.classList.toggle('hidden',!done);
  document.getElementById('say').textContent=!done?'ようこそ。気になるゲームから、やってみよう。'
    :(done>=all?'ぜんぶ制覇！ つぎは自己ベストをねらおう。':'いい調子。つぎはどれにする？');
  document.getElementById('clr').classList.toggle('hidden',!done);
}
function clearRecords(){
  if(!confirm('この端末に保存した自己ベストなどの記録をすべて消します。よろしいですか？'))return;
  try{
    const ks=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(PRE)===0)ks.push(k);}
    ks.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  paintRecords();
}
// ゲームから「戻る」で帰ってきたときも描きなおす
window.addEventListener('pageshow',paintRecords);
</script>
</body>
</html>
